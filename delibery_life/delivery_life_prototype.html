<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DELIVERY — 仮想報酬ダッシュボード</title>
<style>
:root{
  --bg:#f4f5f7; --card:#fff; --text:#17181b; --muted:#74777d;
  --line:#e4e6ea; --accent:#111; --good:#1d8a55; --danger:#c53d3d;
}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);
font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.app{max-width:760px;margin:auto;padding:20px 16px 80px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.logo{font-weight:900;letter-spacing:.08em}.date{font-size:12px;color:var(--muted)}
.hero{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:24px;margin-bottom:14px}
.label{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.08em}
.balance{font-size:46px;font-weight:900;letter-spacing:-.04em;margin:3px 0 14px}
.progress{height:9px;background:#eceef1;border-radius:99px;overflow:hidden}
.progress>div{height:100%;background:var(--accent);width:0%;transition:.3s}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:16px}
.stat{border-top:1px solid var(--line);padding-top:10px}
.stat b{display:block;font-size:18px}.stat span{font-size:11px;color:var(--muted)}
.grid{display:grid;grid-template-columns:1.1fr .9fr;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px}
h2{font-size:15px;margin:0 0 14px}
form{display:grid;gap:9px}
input,select,button{font:inherit}
input,select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff}
button{border:0;border-radius:10px;padding:11px 14px;font-weight:800;cursor:pointer}
.primary{background:#111;color:#fff}.ghost{background:#f0f1f3}.danger{color:var(--danger);background:#fff}
.task{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.task:last-child{border-bottom:0}.task-name{font-size:14px}.reward{font-weight:900;white-space:nowrap}
.task small{display:block;color:var(--muted);margin-top:2px}
.history{max-height:330px;overflow:auto}
.empty{color:var(--muted);font-size:13px;padding:15px 0}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}
@media(max-width:650px){.grid{grid-template-columns:1fr}.balance{font-size:40px}}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="logo">DELIVERY / LIFE</div>
  <div class="date" id="today"></div>
</header>

<section class="hero">
  <div class="label">TODAY'S REWARD</div>
  <div class="balance"><span id="todayPoints">0</span> pt</div>
  <div class="progress"><div id="bar"></div></div>
  <div class="stats">
    <div class="stat"><b id="weekPoints">0</b><span>THIS WEEK</span></div>
    <div class="stat"><b id="monthPoints">0</b><span>THIS MONTH</span></div>
    <div class="stat"><b id="allPoints">0</b><span>ALL TIME</span></div>
  </div>
</section>

<div class="grid">
<section class="card">
<h2>＋ 配達を完了</h2>
<form id="taskForm">
  <input id="taskName" maxlength="80" placeholder="例：FE問題を10問解く" required>
  <div class="row">
    <select id="category">
      <option>学習</option><option>開発</option><option>調査</option>
      <option>制作</option><option>仕事</option><option>趣味</option><option>その他</option>
    </select>
    <input id="reward" type="number" min="1" max="100000" step="1" value="500" required>
  </div>
  <button class="primary" type="submit">配達完了　＋<span id="rewardPreview">500</span> pt</button>
</form>
</section>

<section class="card">
<h2>今日の目標</h2>
<div style="font-size:12px;color:var(--muted);margin-bottom:8px">目標ポイント</div>
<input id="goal" type="number" min="1" max="1000000" step="100" value="3000">
<p style="font-size:12px;color:var(--muted);line-height:1.6">
「何時間頑張ったか」ではなく、<b>完了した仕事が何件あるか</b>を記録します。
</p>
</section>

<section class="card">
<h2>今日の配達</h2>
<div id="history" class="history"></div>
</section>

<section class="card">
<h2>設定</h2>
<button class="ghost" id="demo">デモデータを入れる</button>
<button class="danger" id="reset" style="margin-top:8px">全データを削除</button>
</section>
</div>
</div>

<script>
"use strict";
const KEY="deliveryLife.v1";
let state={tasks:[],goal:3000};

function load(){
  try{
    const raw=localStorage.getItem(KEY);
    if(!raw)return;
    const parsed=JSON.parse(raw);
    if(!parsed || !Array.isArray(parsed.tasks)) throw new Error("invalid data");
    state={tasks:parsed.tasks.filter(t=>t && Number.isFinite(t.points) && typeof t.name==="string"),
           goal:Number.isFinite(parsed.goal)?parsed.goal:3000};
  }catch(e){console.error("load failed",e); state={tasks:[],goal:3000};}
}
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(state));}
  catch(e){alert("保存に失敗しました。ブラウザの保存領域を確認してください。");}
}
function dayKey(d=new Date()){return d.toISOString().slice(0,10)}
function fmt(n){return Math.round(n).toLocaleString("ja-JP")}
function startOfWeek(d){
  const x=new Date(d); const day=x.getDay(); x.setDate(x.getDate()-(day===0?6:day-1));
  x.setHours(0,0,0,0); return x;
}
function render(){
  const now=new Date(), today=dayKey(now);
  document.getElementById("today").textContent=now.toLocaleDateString("ja-JP",{year:"numeric",month:"long",day:"numeric"});
  const todayTasks=state.tasks.filter(t=>t.date===today);
  const todayPts=todayTasks.reduce((s,t)=>s+t.points,0);
  const monday=startOfWeek(now);
  const weekPts=state.tasks.filter(t=>new Date(t.createdAt)>=monday).reduce((s,t)=>s+t.points,0);
  const month=now.toISOString().slice(0,7);
  const monthPts=state.tasks.filter(t=>t.date.startsWith(month)).reduce((s,t)=>s+t.points,0);
  const allPts=state.tasks.reduce((s,t)=>s+t.points,0);
  document.getElementById("todayPoints").textContent=fmt(todayPts);
  document.getElementById("weekPoints").textContent=fmt(weekPts);
  document.getElementById("monthPoints").textContent=fmt(monthPts);
  document.getElementById("allPoints").textContent=fmt(allPts);
  document.getElementById("goal").value=state.goal;
  document.getElementById("bar").style.width=Math.min(100,todayPts/state.goal*100)+"%";

  const h=document.getElementById("history");
  h.innerHTML="";
  if(!todayTasks.length){h.innerHTML='<div class="empty">まだ配達はありません。最初の1件を完了しましょう。</div>';return;}
  [...todayTasks].reverse().forEach(t=>{
    const el=document.createElement("div"); el.className="task";
    const left=document.createElement("div");
    const name=document.createElement("div"); name.className="task-name"; name.textContent=t.name;
    const small=document.createElement("small"); small.textContent=t.category+" ・ "+new Date(t.createdAt).toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit"});
    left.append(name,small);
    const right=document.createElement("div"); right.className="reward"; right.textContent="+"+fmt(t.points)+" pt";
    el.append(left,right); h.appendChild(el);
  });
}
document.getElementById("taskForm").addEventListener("submit",e=>{
  e.preventDefault();
  try{
    const name=document.getElementById("taskName").value.trim();
    const category=document.getElementById("category").value;
    const points=Number(document.getElementById("reward").value);
    if(!name || !Number.isInteger(points) || points<1 || points>100000) throw new Error("入力値が不正です");
    state.tasks.push({id:crypto.randomUUID?.()||String(Date.now()),name,category,points,
      date:dayKey(),createdAt:new Date().toISOString()});
    save(); e.target.reset(); document.getElementById("reward").value=500; render();
  }catch(err){alert(err.message||"登録に失敗しました。");}
});
document.getElementById("reward").addEventListener("input",e=>{
  const n=Number(e.target.value); document.getElementById("rewardPreview").textContent=Number.isFinite(n)?fmt(n):"0";
});
document.getElementById("goal").addEventListener("change",e=>{
  const n=Number(e.target.value); if(Number.isInteger(n)&&n>0&&n<=1000000){state.goal=n;save();render();}
});
document.getElementById("reset").addEventListener("click",()=>{
  if(confirm("本当に全データを削除しますか？この操作は元に戻せません。")){
    state={tasks:[],goal:3000}; save(); render();
  }
});
document.getElementById("demo").addEventListener("click",()=>{
  const d=dayKey(), now=Date.now();
  state.tasks=[
    {id:"d1",name:"FE問題を10問解く",category:"学習",points:500,date:d,createdAt:new Date(now-7200000).toISOString()},
    {id:"d2",name:"AIエージェントを調査",category:"調査",points:800,date:d,createdAt:new Date(now-3600000).toISOString()},
    {id:"d3",name:"UIを1画面完成",category:"制作",points:1000,date:d,createdAt:new Date(now-1200000).toISOString()}
  ];
  save();render();
});
load();render();
</script>
</body>
</html>
